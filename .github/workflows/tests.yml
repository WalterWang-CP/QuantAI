name: QuantAI tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite+pysqlite:///:memory:
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q

  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantai_test
          POSTGRES_PASSWORD: quantai_test
          POSTGRES_DB: quantai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantai_test -d quantai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://quantai_test:quantai_test@localhost:5432/quantai_test
      QUANTAI_TEST_DATABASE_URL: postgresql+psycopg://quantai_test:quantai_test@localhost:5432/quantai_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest -q
